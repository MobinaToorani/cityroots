name: Refresh Toronto listings

# Toronto's events come from the City's open data feed and go stale within weeks.
# Turn this on by adding a DATABASE_URL repository secret; until then it skips itself.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays, early morning in Toronto
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
      - if: env.DATABASE_URL != ''
        run: npm ci
      - if: env.DATABASE_URL != ''
        run: npm run data:toronto
      - if: env.DATABASE_URL != ''
        run: npx tsx scripts/seed.ts --city=toronto
