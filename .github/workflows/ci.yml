name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI uses embedded Postgres (PGlite); no external database is needed.
  AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  EMAIL_LOG_ONLY: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migration dry-run and drift check
        run: npm run db:dry-run

  e2e:
    name: Build, copy rules, Playwright, Lighthouse
    runs-on: ubuntu-latest
    needs: checks
    # Build and test with every launch-gated surface on, so all of it is checked.
    env:
      FEATURE_PARTNERS: "true"
      FEATURE_BUSINESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create and seed the database
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Copy and design rules (source and built output)
        run: npm run check:copy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Lighthouse CI budgets
        run: npx lhci autorun
